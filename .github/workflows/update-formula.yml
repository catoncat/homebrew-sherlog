name: Update formula

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest release formula
        run: curl --fail --location --retry 3 --output Formula/sherlog.rb https://github.com/catoncat/sherlog/releases/latest/download/sherlog.rb

      - name: Commit formula update
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula/sherlog.rb; then
            echo "Formula is already current"
            exit 0
          fi
          version=$(sed -n 's/^  version "\([^"]*\)"$/\1/p' Formula/sherlog.rb)
          test -n "$version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/sherlog.rb
          git commit -m "Update sherlog to $version"
          git push
